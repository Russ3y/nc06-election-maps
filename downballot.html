const select=document.getElementById('layer'), detail=document.getElementById('detail');


const pct=n=>n==null?'N/A':(n*100).toFixed(1)+'%';const pp=n=>n==null?'N/A':(n>=0?'+':'')+n.toFixed(1)+' pp';
const num=n=>Number(n).toLocaleString();
const layers=[['amend_avg','Average amendment For share − McDowell'],['amend_id','Photo ID amendment − McDowell'],['amend_income','Income tax cap − McDowell'],['amend_property','Property tax limit − McDowell'],['house','NC House Republican (R) − McDowell (R)'],['senate','NC Senate Republican (R) − McDowell (R)'],['rep','Republican registration share'],['una','Unaffiliated registration share'],['turnout','Congressional votes / active registration (approximate)']];
for(const [k,t] of layers){let o=document.createElement('option');o.value=k;o.textContent=t;select.appendChild(o)}
const map=L.map('map',{zoomControl:true,scrollWheelZoom:false});
let geo;
const districtPane=map.createPane("districtOutlines");districtPane.style.zIndex=450;districtPane.style.pointerEvents="none";
const districtGroups={};
for(const kind of ["house","senate"]){
 const outlines=L.geoJSON(DISTRICTS[kind],{pane:"districtOutlines",interactive:false,style:{color:"#243954",weight:1.7,opacity:0.85,fillOpacity:0}});
 const labels=L.layerGroup();
 for(const f of DISTRICTS[kind].features){const id=f.properties.district;const center=f.properties.label;labels.addLayer(L.marker(center,{interactive:false,icon:L.divIcon({className:"district-number",html:`<span>${kind==="house"?"H":"S"}${id}</span>`,iconSize:[38,20],iconAnchor:[19,10]})}));}
 districtGroups[kind]={outlines,labels};
}
L.geoJSON(COUNTIES,{style:{color:'#14283c',weight:2.4,fillOpacity:0},interactive:false}).addTo(map);
function rows(p,type){return p.comparisons.filter(x=>x.type===type)}
function amend(p,fragment){return rows(p,'Amendment').filter(x=>!fragment||x.contest.includes(fragment))}
function gap(p,layer){let a;if(layer==='amend_avg'){a=amend(p);return a.length? a.reduce((s,x)=>s+x.gap,0)/a.length:null}if(layer==='amend_id')a=amend(p,'PHOTO ID');if(layer==='amend_income')a=amend(p,'INCOME TAX');if(layer==='amend_property')a=amend(p,'PROPERTY TAX');if(layer==='house')a=rows(p,'State House');if(layer==='senate')a=rows(p,'State Senate');return a.length?a[0].gap:null}
function value(p,layer){if(layer==='rep')return p.reg?100*p.reg.R/p.reg.active:null;if(layer==='una')return p.reg?100*p.reg.U/p.reg.active:null;if(layer==='turnout')return p.reg&&p.reg.active?100*p.total/p.reg.active:null;return gap(p,layer)}
function color(p){let v=value(p,select.value);if(v===null||!Number.isFinite(v))return '#d5dbe3';if(['rep','una','turnout'].includes(select.value))return v<20?'#f0f5f9':v<35?'#c4d8e8':v<50?'#8eb9d5':v<65?'#4d86b3':'#205381';if(['house','senate'].includes(select.value))return v<=-2?'#225d9a':v<=-0.5?'#82b0d7':v<0.5?'#dfba59':v<2?'#e88c72':'#ae3e3e';return v< -10?'#285d9b':v< -3?'#88b1d7':v<=3?'#e9c57e':v<=10?'#e8a18e':'#b84c42'}
function styleFeature(f){return {color:'#ffffff',weight:.55,fillColor:color(f.properties),fillOpacity:1}}
function update(){geo.setStyle(styleFeature);for(const kind of ["house","senate"]){const group=districtGroups[kind];if(select.value===kind){group.outlines.addTo(map);group.labels.addTo(map)}else{map.removeLayer(group.outlines);map.removeLayer(group.labels)}}document.getElementById('scale').textContent=['rep','una','turnout'].includes(select.value)?'Light to dark blue: lower to higher percentage. Gray: unavailable.':(['house','senate'].includes(select.value)?'NC legislative comparison (percentage points): Dark blue ≤ −2 · Light blue −2 to −0.5 · Gold −0.5 to +0.5 · Coral +0.5 to +2 · Dark red ≥ +2 · Gray: no comparable result.':'Blue: lower than McDowell · Gold: similar · Red: higher than McDowell · Gray: unavailable.')}
select.addEventListener('change',update);
function show(p){let r=p.reg, a=amend(p),house=rows(p,'State House'),senate=rows(p,'State Senate');let m=a.length?a[0].mshare:(p.total?p.mcdowell/p.total:null);let content=`<h2>${p.county} · ${p.precinct}</h2><div class="stat"><span>McDowell (R) share (precinct file)</span><strong>${pct(m)}</strong></div><div class="stat"><span>Congressional votes (precinct file)</span><strong>${num(p.total||0)}</strong></div>`;
if(r){content+=`<h3>Registration</h3><div class="stat"><span>Active registered</span><strong>${num(r.active)}</strong></div>`;for(const [name,k] of [['Republican','R'],['Democratic','D'],['Unaffiliated','U'],['Other','O']])content+=`<div class="stat"><span>${name}</span><strong>${pct(r[k]/r.active)} (${num(r[k])})</strong></div>`;content+=`<div class="stat"><span>Congressional votes / registration</span><strong>${pct(p.total/r.active)}</strong></div>`}
function compSection(title,items){if(!items.length)return '';let h=`<h3>${title}</h3>`;for(const x of items){let name=x.contest.replace('CONSTITUTIONAL AMENDMENT - ','').replace('NC HOUSE OF REPRESENTATIVES DISTRICT ','House ').replace('NC STATE SENATE DISTRICT ','Senate ');h+=`<div class="comp"><b>${name}</b>${x.type==='Amendment'?`<small>${x.choice}</small>`:`<div class="candidate-name">${x.choice} <strong>(R)</strong></div>`}<div>Share: ${pct(x.share)} · Difference: <b>${pp(x.gap)}</b></div><small>${num(x.votes)} of ${num(x.total)} votes in this contest</small></div>`}return h}
content+=compSection('Constitutional amendments',a)+compSection('NC House',house)+compSection('NC Senate',senate);content+=`<p class="caution">Shares use the uploaded precinct results. Congressional turnout is an approximate vote-to-registration ratio, not certified voter turnout. Amendment support does not identify individual candidate preferences.</p>`;detail.innerHTML=content}
geo=L.geoJSON(DATA,{style:styleFeature,onEachFeature:(f,l)=>{l.on('click',()=>show(f.properties));l.bindTooltip(f.properties.county+' · '+f.properties.precinct)}}).addTo(map);
map.fitBounds(geo.getBounds(),{padding:[12,12]});
update();
